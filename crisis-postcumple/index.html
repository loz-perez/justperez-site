<style>
  :root{
    --bg: #0F1717;
    --bg-alt: #16211F;
    --bg-alt-2: #1C2A27;
    --ink: #ECEEE8;
    --ink-dim: #9FAEA7;
    --ink-faint: #56655F;
    --accent: #E8A33D;
    --accent-2: #4FA98B;
    --danger: #D36A6A;
    --line: rgba(236,238,232,0.14);
    --line-soft: rgba(236,238,232,0.07);

    --font-display: "Fraunces", Georgia, "Iowan Old Style", serif;
    --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  *{ box-sizing: border-box; }
  html{ scrollbar-color: var(--ink-faint) transparent; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection{ background: var(--accent); color: #221604; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

  .bg-grid{
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 78% 55% at 50% 0%, black 0%, transparent 72%);
    mask-image: radial-gradient(ellipse 78% 55% at 50% 0%, black 0%, transparent 72%);
  }
  .bg-grain{
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5;
    background-repeat: repeat; background-size: 80px 80px;
  }
  .bg-glow{
    position: fixed; top: -12%; left: 50%; width: min(900px, 140vw); height: 520px;
    transform: translateX(-50%); pointer-events: none; z-index: 0;
    background: radial-gradient(closest-side, rgba(232,163,61,0.08), rgba(232,163,61,0) 70%);
  }
  .regmark{ position: fixed; width: 13px; height: 13px; z-index: 0; opacity: 0.4; pointer-events: none;
    background:
      linear-gradient(var(--ink-faint), var(--ink-faint)) center / 100% 1px no-repeat,
      linear-gradient(var(--ink-faint), var(--ink-faint)) center / 1px 100% no-repeat; }
  .regmark.tl{ top: 16px; left: 16px; } .regmark.tr{ top: 16px; right: 16px; }
  .regmark.bl{ bottom: 16px; left: 16px; } .regmark.br{ bottom: 16px; right: 16px; }
  @media (max-width: 520px){ .regmark{ display: none; } }

  .page{
    max-width: 680px; margin: 0 auto;
    padding: clamp(2.5rem, 6vw, 5.5rem) 1.5rem clamp(3rem, 8vw, 5rem);
    display: flex; flex-direction: column; flex: 1;
    width: 100%;
  }
  .page > *{ position: relative; z-index: 1; }

  .eyebrow{
    font-family: var(--font-mono);
    font-size: 0.725rem;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 0.5rem;
  }

  h1{
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 4.5vw, 2.7rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.12;
    margin: 0 0 0.15em;
  }
  h1 em{
    font-style: italic;
    font-weight: 380;
    color: var(--ink-dim);
  }

  .subtitle{
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--ink-faint);
    margin-bottom: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: 0.3px;
  }

  .input-group{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }

  .input-group label{
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--ink-dim);
  }

  .input-group input{
    width: 80px;
    padding: 8px 12px;
    background: var(--bg-alt);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 1rem;
    text-align: center;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }
  .input-group input::-webkit-outer-spin-button,
  .input-group input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .input-group input:focus{ border-color: var(--accent); }

  .input-group .unit{
    font-family: var(--font-body);
    font-size: 0.9rem;
    color: var(--ink-dim);
  }

  .btn{
    background: var(--bg-alt);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 22px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.5px;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover{
    background: var(--bg-alt-2);
    border-color: var(--accent);
  }

  .quote-box{
    margin-top: clamp(2rem, 5vw, 3rem);
    border-left: 2px solid var(--accent);
    padding: 0 0 0 1.4rem;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .quote-box .age-badge{
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }

  .quote-box .age-badge::before{ content: '╱╱ '; }
  .quote-box .age-badge::after{ content: ' AÑOS ╱╱'; }

  .quote-text{
    font-family: var(--font-display);
    font-size: clamp(1.05rem, 2.2vw, 1.3rem);
    line-height: 1.65;
    color: var(--ink);
    font-style: italic;
    animation: fadeIn 0.45s ease;
  }

  @keyframes fadeIn {
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .quote-box .placeholder{
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--ink-faint);
  }

  .btn-panic-wrap{
    margin-top: 1.8rem;
    display: none;
  }

  .btn-panic{
    background: none;
    border: none;
    padding: 6px 0;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.5px;
    color: var(--ink-faint);
    cursor: pointer;
    transition: color 0.3s;
    opacity: 0.7;
  }
  .btn-panic:hover{ color: var(--ink-dim); opacity: 1; }
  .btn-panic:disabled{
    color: #3A2A2A;
    cursor: default;
    opacity: 0.5;
    pointer-events: none;
  }

  .panic-msg{
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--danger);
    margin-top: 4px;
    display: none;
    animation: fadeIn 0.5s ease;
  }

  .footer-spacer{ flex: 1; }

  .nav-back{
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }
  .nav-back a{
    color: var(--ink-faint);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-back a:hover{ color: var(--accent); }

  hr{
    border: none;
    border-top: 1px solid var(--line-soft);
    margin: 2.5rem 0 1.5rem;
  }

  @media (max-width: 480px){
    .input-group{ flex-direction: column; align-items: flex-start; }
    .quote-box{ padding-left: 1rem; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="regmark tl"></div><div class="regmark tr"></div>
<div class="regmark bl"></div><div class="regmark br"></div>

<div class="page">

  <p class="eyebrow">✦ casa-perez / crisis</p>

  <h1>Generador de <em>Crisis</em><br>Post-Cumpleaños</h1>
  <p class="subtitle">la edad es solo un número — la crisis es el regalo que sigue dando</p>

  <div class="input-group">
    <label for="age-input">edad</label>
    <input type="number" id="age-input" min="1" max="110" value="30">
    <span class="unit">años cumplidos</span>
    <button class="btn" onclick="generate()">Generar Crisis</button>
  </div>

  <div class="quote-box" id="quote-box">
    <div class="placeholder" id="placeholder">— ingresá tu edad y apretá generar —</div>
    <div class="age-badge" id="age-badge" style="display:none;"></div>
    <div class="quote-text" id="quote-text" style="display:none;"></div>
  </div>

  <div class="btn-panic-wrap" id="panic-wrap">
    <button class="btn-panic" id="btn-panic" onclick="panic()">No me hagas pensar en eso</button>
    <div class="panic-msg" id="panic-msg">Ya es tarde.</div>
  </div>

  <div class="footer-spacer"></div>

  <hr>
  <div class="nav-back">
    <a href="/">← casa-perez</a>
  </div>

</div>

<script>
  const frases = [
    { min: 1, max: 12, texto: 'Todavía no entendés qué es un año, pero ya te preguntás si vale la pena.' },
    { min: 1, max: 12, texto: 'Pasaste más tiempo viendo dibujitos que aprendiendo a ser feliz.' },
    { min: 1, max: 12, texto: 'Tu mayor logro es no haberte caído de la cama.' },
    { min: 1, max: 12, texto: 'Todavía pensás que los adultos saben lo que hacen.' },
    { min: 13, max: 19, texto: 'La edad en la que todo es una crisis y ninguna es real.' },
    { min: 13, max: 19, texto: 'Estás convencido de que nadie te entiende. Vas por buen camino.' },
    { min: 13, max: 19, texto: 'Tu yo del futuro te va a querer abofetear por tus decisiones estéticas.' },
    { min: 13, max: 19, texto: 'Creés que tenés tiempo. Un clásico.' },
    { min: 20, max: 25, texto: 'Ya no sos adolescente pero tampoco un adulto. Sos un espantapájaros existencial.' },
    { min: 20, max: 25, texto: 'Tus rodillas empiezan a cobrarte las fiestas que todavía no tuviste.' },
    { min: 20, max: 25, texto: 'Descubriste que "ser adulto" es un rumor falso que nadie confirmó.' },
    { min: 20, max: 25, texto: 'Tu colchón ya tiene la forma de tu depresión.' },
    { min: 26, max: 30, texto: 'Empezás a calcular cuánto tiempo te queda de vida en el laburo.' },
    { min: 26, max: 30, texto: 'Tu niño interior se pregunta por qué compraste tazas de cerámica en vez de un castillo de LEGO.' },
    { min: 26, max: 30, texto: 'Dejaste de creer en los Reyes Magos y empezaste a creer en el ibuprofeno.' },
    { min: 26, max: 30, texto: 'Tu espalda ya te mandó el primer aviso de desalojo.' },
    { min: 31, max: 35, texto: 'Ya podés decir "en mis tiempos" sin sonar irónico. Bienvenido al club.' },
    { min: 31, max: 35, texto: 'Estás a una mala postura de que la espalda te cobre alquiler.' },
    { min: 31, max: 35, texto: 'Te emociona más una oferta de 2×1 en el súper que cualquier cosa que haya pasado este año.' },
    { min: 31, max: 35, texto: 'Ya dejaste de contar velas. Contás deudas.' },
    { min: 36, max: 40, texto: 'Cada cana nueva es una advertencia de que el tiempo te está haciendo una lista.' },
    { min: 36, max: 40, texto: 'La edad exacta en la que deberías tener un plan, pero tenés una suscripción a Disney+.' },
    { min: 36, max: 40, texto: 'Ya no te resfriás. Tenés "malestares estratégicos".' },
    { min: 36, max: 40, texto: 'Tu metabolismo te mandó una carta de renuncia.' },
    { min: 41, max: 50, texto: 'Ya no tenés crisis existenciales. Tenés reuniones de comité.' },
    { min: 41, max: 50, texto: 'Tu médico de cabecera te conoce mejor que tu pareja.' },
    { min: 41, max: 50, texto: 'Podés comprarte todo lo que querías a los 20. Ya no te acordás qué era.' },
    { min: 41, max: 50, texto: 'Tus amigos se dividen entre los que se divorciaron y los que mienten.' },
    { min: 51, max: 65, texto: 'La edad a la que ya no sabés si estás en la mitad de tu carrera o en la mitad de tu crisis.' },
    { min: 51, max: 65, texto: 'Empezás a entender los chistes de Mafalda.' },
    { min: 51, max: 65, texto: 'Descubriste que "disfrutar la vida" requiere más sueño del que te queda.' },
    { min: 66, max: 80, texto: 'Vivís de recuerdos. El problema es que algunos no son tuyos.' },
    { min: 66, max: 80, texto: 'La muerte dejó de ser un concepto abstracto y empezó a ser una suscripción que no pediste.' },
    { min: 81, max: 110, texto: 'Estás en tiempo de descuento. Pero quién lleva la cuenta ya.' },
    { min: 81, max: 110, texto: 'Sobreviviste a todo. Incluso a este generador de crisis.' },
    { texto: 'Vas a cumplir ${edad} y tu mayor logro sigue siendo haber encontrado un estacionamiento en el centro.' },
    { texto: 'La adultez es básicamente Google Calendar con un fondo negro.' },
    { texto: 'Tu médico te dijo "a esta edad..." y dejaste de escuchar.' },
    { texto: 'Entraste a esta app esperando una broma. Recibiste una verdad incómoda.' },
    { texto: 'Bienvenido a los ${edad}. Pasá, sentate. El sinsentido es por cuenta de la casa.' },
    { texto: 'A esta altura deberías tener un plan quinquenal. Tenés un carrito abandonado de Mercado Libre.' },
    { texto: '${edad} años después, seguís sin saber si esto es una crisis de la mediana edad o una de la tercera.' },
    { texto: 'Tu idea de "aventura" ahora es probar una marca nueva de café.' },
    { texto: 'Deberías estar invirtiendo. Invertís tiempo en pensar que deberías estar invirtiendo.' },
    { texto: 'Tu celu te notifica que es tu cumpleaños — como si hiciera falta que te lo recuerden.' },
  ];

  const ageInput = document.getElementById('age-input');
  const badgeEl = document.getElementById('age-badge');
  const textEl = document.getElementById('quote-text');
  const placeholderEl = document.getElementById('placeholder');
  const panicBtn = document.getElementById('btn-panic');
  const panicMsg = document.getElementById('panic-msg');
  const panicWrap = document.getElementById('panic-wrap');

  let panicDone = false;
  let lastText = '';

  function generate() {
    let edad = parseInt(ageInput.value);
    if (isNaN(edad) || edad < 1) edad = 1;
    if (edad > 110) edad = 110;
    ageInput.value = edad;

    let pool = frases.filter(f => f.min !== undefined && edad >= f.min && edad <= f.max);
    if (pool.length === 0) pool = frases.filter(f => f.min === undefined);

    let c;
    do { c = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && c.texto === lastText);
    lastText = c.texto;

    const txt = c.texto.replace(/\$\{edad\}/g, edad);
    badgeEl.textContent = edad;
    badgeEl.style.display = 'block';
    textEl.textContent = txt;
    textEl.style.display = 'block';
    placeholderEl.style.display = 'none';

    textEl.style.animation = 'none';
    requestAnimationFrame(() => textEl.style.animation = 'fadeIn 0.45s ease');

    panicWrap.style.display = 'block';
    if (!panicDone) {
      panicBtn.textContent = 'No me hagas pensar en eso';
      panicBtn.disabled = false;
      panicMsg.style.display = 'none';
    }
  }

  function panic() {
    if (panicDone) return;
    panicDone = true;
    panicBtn.textContent = 'Ya es tarde.';
    panicBtn.disabled = true;
    panicMsg.style.display = 'block';
  }

  ageInput.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
  generate();
</script>
</body>
</html>
