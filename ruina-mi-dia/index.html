<style>
:root{--bg:#0F1717;--bg-alt:#16211F;--bg-alt-2:#1C2A27;--ink:#ECEEE8;--ink-dim:#9FAEA7;--ink-faint:#56655F;--accent:#E8A33D;--accent-2:#4FA98B;--danger:#D36A6A;--line:rgba(236,238,232,0.14);--line-soft:rgba(236,238,232,0.07);--font-display:"Fraunces",Georgia,"Iowan Old Style",serif;--font-body:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#221604}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:42px 42px;-webkit-mask-image:radial-gradient(ellipse 78% 55% at 50% 0%,black 0%,transparent 72%);mask-image:radial-gradient(ellipse 78% 55% at 50% 0%,black 0%,transparent 72%)}
.bg-glow{position:fixed;top:-12%;left:50%;width:min(900px,140vw);height:520px;transform:translateX(-50%);pointer-events:none;z-index:0;background:radial-gradient(closest-side,rgba(232,163,61,0.08),rgba(232,163,61,0) 70%)}
.regmark{position:fixed;width:13px;height:13px;z-index:0;opacity:0.4;pointer-events:none;background:linear-gradient(var(--ink-faint),var(--ink-faint)) center/100% 1px no-repeat,linear-gradient(var(--ink-faint),var(--ink-faint)) center/1px 100% no-repeat}
.regmark.tl{top:16px;left:16px}.regmark.tr{top:16px;right:16px}.regmark.bl{bottom:16px;left:16px}.regmark.br{bottom:16px;right:16px}
@media(max-width:520px){.regmark{display:none}}
.page{max-width:660px;margin:0 auto;padding:clamp(2.5rem,6vw,5rem) 1.5rem;flex:1;width:100%}.page>*{position:relative;z-index:1}
.eyebrow{font-family:var(--font-mono);font-size:.725rem;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.5rem}
h1{font-family:var(--font-display);font-size:clamp(1.6rem,4vw,2.3rem);font-weight:500;letter-spacing:-.02em;line-height:1.12;margin:0 0 .1em}
.sub{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-faint);margin-bottom:clamp(1.5rem,4vw,2.5rem);letter-spacing:.3px}
.btn{background:var(--bg-alt);border:1px solid var(--line);border-radius:8px;padding:10px 22px;font-family:var(--font-mono);font-size:.8rem;color:var(--ink);cursor:pointer;transition:all .2s}
.btn:hover{background:var(--bg-alt-2);border-color:var(--accent)}
.output-box{margin-top:clamp(1.5rem,4vw,2.5rem);border-left:2px solid var(--accent);padding:0 0 0 1.4rem;min-height:100px;display:flex;flex-direction:column;justify-content:center}
.output-text{font-family:var(--font-display);font-size:clamp(1rem,2.2vw,1.25rem);line-height:1.65;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.placeholder{font-family:var(--font-mono);font-size:.82rem;color:var(--ink-faint)}
.footer-spacer{flex:1}
.nav-back{font-family:var(--font-mono);font-size:.75rem;margin-top:2rem}.nav-back a{color:var(--ink-faint);text-decoration:none;transition:color .2s}.nav-back a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="bg-grid"></div><div class="bg-glow"></div>
<div class="regmark tl"></div><div class="regmark tr"></div>
<div class="regmark bl"></div><div class="regmark br"></div>
<div class="page">
<p class="eyebrow">✦ casa-perez / ruina</p>
<h1>Ruina Mi Día</h1>
<p class="sub">un click y tu día se viene abajo</p>
<button class="btn" onclick="generar()">Arruiname el día</button>
<div class="output-box"><div class="placeholder" id="placeholder">— todavía no pasó nada —</div><div class="output-text" id="output" style="display:none"></div></div>
<div class="footer-spacer"></div>
<div class="nav-back"><a href="/">← casa-perez</a></div>
</div>
<script>
const ruinas=[
"Se te acaba el cargador del celu y estás en la calle sin batería y sin mapa mental.",
"Te despertás 40 minutos antes de la alarma. No podés volver a dormirte. Te quedás mirando el techo.",
"El subte se frena entre estaciones. Apagan las luces. Nadie dice nada.",
"El café de la mañana tiene un gusto raro. Muy raro. Pero ya te lo tomaste.",
"Te llega un mail de Recursos Humanos que empieza con \"Hola, ¿un momento para hablar?\"",
"El GPS dice \"llegaste a tu destino\" y no hay nada. Solo un descampado.",
"Se te rompen los auriculares. Escuchás tu propia respiración todo el viaje.",
"Un conocido te saluda por la calle y no te acordás ni cómo se llama. Ya es tarde.",
"Empezó a llover justo cuando saliste de tu casa. No tenés paraguas. Nunca tenés.",
"Te quedaste dormido en el bondi y apareciste en el barrio de al lado.",
"El compañero de trabajo te cuenta un sueño que tuvo. En detalle. Con principio, desarrollo y final.",
"Te pusiste esa campera que pensabas que tenía plata en el bolsillo. No tenía.",
"Hiciste match. Le mandaste un mensaje. Te dejó en visto. Ya te olvidó.",
"Te invitaron al grupo de WhatsApp de los vecinos. Ahora te van a llegar 300 mensajes por día de chistes malos y fotos de gatos.",
"Llegás al cajero y hay fila. Una señora está discutiendo con la máquina.",
"El encargado del edificio te dijo que mañana cortan el agua. Todo el día.",
"Te acordaste de algo vergonzoso que hiciste en 2014. No lo podés dejar de pensar.",
"El kiosquero no te dio el vuelto exacto y ya te fuiste de la puerta. Te comiste 200 pesos.",
"Posteaste algo en la red social equivocada. Tus compañeros del laburo ya vieron.",
"Te dejaron un mensaje de voz de 3 minutos. No te dan ganas de escucharlo.",
"Fuiste a la cocina por algo y al llegar te olvidaste qué. Volvés. Lo mismo.",
"Te invitaron a algo para el viernes. Ya es viernes.",
"El ascensor está descompuesto. Vivís en el 8°.",
"Lavaste ropa y se te escapó un pañuelo. Todo quedó lleno de pelusas blancas.",
"Se acabó el papel higiénico. Nadie avisó. Nunca avisan.",
"El delivery llegó frío y con el pedido de otra persona. Ahora tenés una milanesa napolitana que no pediste.",
"Dejaste la pava eléctrica prendida. Te volvés a tu casa. La pava ya hirvió hace rato.",
"Te invitó un boliche. Está a 45 minutos. La entrada sale carísima. Van tus compañeros de laburo.",
];
let last=-1;
function generar(){
let i;do{i=Math.floor(Math.random()*ruinas.length)}while(i===last&&ruinas.length>1);last=i;
const el=document.getElementById('output'),pl=document.getElementById('placeholder');
pl.style.display='none';el.style.display='block';el.textContent=ruinas[i];
el.style.animation='none';requestAnimationFrame(()=>el.style.animation='fadeIn .45s ease');
}
</script>
</body>
</html>
